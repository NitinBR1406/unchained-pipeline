# CI Temporal stack V02.5 (BIND_ON_IP=0.0.0.0 so the frontend listens on 127.0.0.1 + container IP -> tctl health + worker registration both work; workers restart:on-failure): 2 worker containers (phase worker, low slots) + BIND-mounted shared side-effect
# dir so the host-run start/resume can read the OBSERVED oracle. Ephemeral; down -v after.
version: "3.8"
services:
  postgresql:
    image: postgres:16
    environment: {POSTGRES_USER: temporal, POSTGRES_PASSWORD: temporal}
  temporal:
    image: temporalio/auto-setup:1.25.0
    depends_on: [postgresql]
    environment: {DB: postgres12, DB_PORT: 5432, POSTGRES_USER: temporal, POSTGRES_PWD: temporal, POSTGRES_SEEDS: postgresql, BIND_ON_IP: "0.0.0.0"}
    ports: ["7233:7233"]
  worker1:
    build: {context: .., dockerfile: Dockerfile.worker}
    restart: on-failure
    command: ["python","temporal_bakeoff.py","worker"]
    depends_on: [temporal]
    environment: {TEMPORAL_ADDRESS: "temporal:7233", MAX_SLOTS: "4", SE_STORE: /data/se/side_effects.json}
    volumes: ["${SE_DIR}:/data/se"]
  worker2:
    build: {context: .., dockerfile: Dockerfile.worker}
    restart: on-failure
    command: ["python","temporal_bakeoff.py","worker"]
    depends_on: [temporal]
    environment: {TEMPORAL_ADDRESS: "temporal:7233", MAX_SLOTS: "4", SE_STORE: /data/se/side_effects.json}
    volumes: ["${SE_DIR}:/data/se"]
