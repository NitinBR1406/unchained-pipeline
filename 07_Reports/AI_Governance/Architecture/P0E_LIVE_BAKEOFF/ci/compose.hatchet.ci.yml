# CI Hatchet stack V02.11 (official gRPC alignment: hatchet-lite engine listens on 7070 and needs
#   SERVER_GRPC_BIND_ADDRESS=0.0.0.0 to be container-reachable; broadcast + published port aligned to 7070).
# (carried) V02.5 server bootstrap fix: SERVER_AUTH_COOKIE_DOMAIN + SERVER_URL so the session store
#   initialises and the API actually starts after tenant creation; then token creation succeeds). 2 workers + shared dir.
version: "3.8"
services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: hatchet, POSTGRES_PASSWORD: hatchet, POSTGRES_DB: hatchet}
  hatchet:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-lite:latest
    depends_on: [postgres]
    environment:
      DATABASE_URL: "postgresql://hatchet:hatchet@postgres:5432/hatchet?sslmode=disable"
      SERVER_AUTH_COOKIE_DOMAIN: "localhost"
      SERVER_AUTH_COOKIE_INSECURE: "t"
      SERVER_AUTH_SET_EMAIL_VERIFIED: "t"
      SERVER_URL: "http://localhost:8888"
      SERVER_GRPC_BIND_ADDRESS: "0.0.0.0"
      SERVER_GRPC_BROADCAST_ADDRESS: "hatchet:7070"
      SERVER_GRPC_INSECURE: "t"
    ports: ["8888:8080","7070:7070"]
  worker1:
    build: {context: .., dockerfile: Dockerfile.worker}
    restart: on-failure
    command: ["python","hatchet_bakeoff.py","worker"]
    depends_on: [hatchet]
    environment: {HATCHET_CLIENT_TOKEN: "${HATCHET_CLIENT_TOKEN}", HATCHET_CLIENT_TLS_STRATEGY: "none", MAX_RUNS: "4", SE_STORE: /data/se/side_effects.json}
    volumes: ["${SE_DIR}:/data/se"]
  worker2:
    build: {context: .., dockerfile: Dockerfile.worker}
    restart: on-failure
    command: ["python","hatchet_bakeoff.py","worker"]
    depends_on: [hatchet]
    environment: {HATCHET_CLIENT_TOKEN: "${HATCHET_CLIENT_TOKEN}", HATCHET_CLIENT_TLS_STRATEGY: "none", MAX_RUNS: "4", SE_STORE: /data/se/side_effects.json}
    volumes: ["${SE_DIR}:/data/se"]
