# CI Hatchet stack V02: 2 worker containers (phase worker, low max_runs) + BIND-mounted shared dir.
version: "3.8"
services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: hatchet, POSTGRES_PASSWORD: hatchet, POSTGRES_DB: hatchet}
  hatchet:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-lite:latest
    depends_on: [postgres]
    environment:
      DATABASE_URL: "postgresql://hatchet:hatchet@postgres:5432/hatchet?sslmode=disable"
      SERVER_AUTH_COOKIE_INSECURE: "t"
      SERVER_GRPC_BROADCAST_ADDRESS: "hatchet:7077"
      SERVER_GRPC_INSECURE: "t"
    ports: ["8888:8080","7077:7077"]
  worker1:
    build: {context: .., dockerfile: Dockerfile.worker}
    restart: on-failure
    command: ["python","hatchet_bakeoff.py","worker"]
    depends_on: [hatchet]
    environment: {HATCHET_CLIENT_TOKEN: "${HATCHET_CLIENT_TOKEN}", HATCHET_CLIENT_TLS_STRATEGY: "none", MAX_RUNS: "4", SE_STORE: /data/se/side_effects.json}
    volumes: ["${SE_DIR}:/data/se"]
  worker2:
    build: {context: .., dockerfile: Dockerfile.worker}
    restart: on-failure
    command: ["python","hatchet_bakeoff.py","worker"]
    depends_on: [hatchet]
    environment: {HATCHET_CLIENT_TOKEN: "${HATCHET_CLIENT_TOKEN}", HATCHET_CLIENT_TLS_STRATEGY: "none", MAX_RUNS: "4", SE_STORE: /data/se/side_effects.json}
    volumes: ["${SE_DIR}:/data/se"]
