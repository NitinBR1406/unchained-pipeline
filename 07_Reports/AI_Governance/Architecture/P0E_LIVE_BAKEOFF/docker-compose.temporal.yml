# Disposable Temporal stack for the P0-E live bake-off. NOT production. Tear down with `docker compose down -v`.
# Authored from Temporal docs; validate in a Docker-capable host.
version: "3.8"
services:
  postgresql:
    image: postgres:16
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    ports: ["5432:5432"]
    volumes: ["temporal_pg:/var/lib/postgresql/data"]
  temporal:
    image: temporalio/auto-setup:1.25.0
    depends_on: ["postgresql"]
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgresql
    ports: ["7233:7233"]
  temporal-ui:
    image: temporalio/ui:2.31.0
    depends_on: ["temporal"]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports: ["8233:8080"]
volumes:
  temporal_pg: {}
