services:
  - type: web
    name: unchained-approval
    env: docker
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: APPROVAL_SIGNING_SECRET
        sync: false
      - key: GITHUB_DISPATCH_TOKEN
        sync: false
      - key: APPROVERS
        value: nitin
      - key: GH_OWNER
        value: NitinBR1406
      - key: GH_REPO
        value: unchained-pipeline
      - key: CONSUMED_STORE
        value: /tmp/_approvals_consumed.json
