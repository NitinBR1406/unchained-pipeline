services:
  - type: web
    name: unchained-approval
    env: docker
    plan: starter
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: approval-state
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: APPROVAL_SIGNING_SECRET
        sync: false
      - key: GITHUB_DISPATCH_TOKEN
        sync: false
      - key: APPROVERS
        value: nitin
      - key: GH_OWNER
        value: NitinBR1406
      - key: GH_REPO
        value: unchained-pipeline
      - key: CONSUMED_STORE
        value: /data/_approvals_consumed.json
      - key: VISUALIZER_CONSUMED_STORE
        value: /data/_visualizer_approvals_consumed.json   # persistent disk -> nonce store survives restarts
      - key: MAKE_APPROVE_WEBHOOK
        sync: false          # new V3-SECURE hook URL (enter in dashboard; never in git)
      - key: MAKE_APPROVE_APIKEY
        sync: false          # x-make-apikey value (must match the Make hook's api key)
      - key: PUBLISH_ELIGIBILITY_APIKEY
        sync: false          # P0-B: shared secret Make sends as x-publish-apikey to /v/publish-eligibility (enter in dashboard; never in git)
      - key: PUBLISH_APPROVALS_STORE
        value: /data/_publish_approvals.json     # server-side 3-gate approval store (persistent disk)
      - key: PUBLISH_GRANTS_STORE
        value: /data/_publish_grants.json        # server-side publish grants: fingerprint/platform/schedule scope, exp, revoked
