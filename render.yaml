services:
  - type: web
    name: unchained-approval
    env: docker
    plan: starter
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: approval-state
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: APPROVAL_SIGNING_SECRET
        sync: false
      - key: GITHUB_DISPATCH_TOKEN
        sync: false
      - key: APPROVERS
        value: nitin
      - key: GH_OWNER
        value: NitinBR1406
      - key: GH_REPO
        value: unchained-pipeline
      - key: CONSUMED_STORE
        value: /data/_approvals_consumed.json
