# P0-E Live Control-Plane Bake-Off — GitHub Actions (ephemeral ubuntu-latest, Docker preinstalled).
# Copy to .github/workflows/p0e-live-bakeoff.yml on branch p0e/live-control-plane-bakeoff.
# Runs REAL Temporal + Hatchet, executes the decision-critical tests incl. scripted docker kill/restart,
# captures resource metrics + image digests + run metadata, writes/hashes all evidence artifacts, then
# tears down (down -v) and verifies no infra remains. NO production secrets are referenced.
name: p0e-live-bakeoff
on:
  workflow_dispatch: {}
  push: { branches: [ "p0e/live-control-plane-bakeoff" ] }
permissions: { contents: read }
jobs:
  bakeoff:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: 07_Reports/AI_Governance/Architecture/P0E_LIVE_BAKEOFF } }
    steps:
      - uses: actions/checkout@v4
      - name: Runtime + run metadata
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import json,os,platform
          json.dump({"GITHUB_RUN_ID":os.environ.get("GITHUB_RUN_ID"),"GIT_COMMIT_SHA":os.environ.get("GITHUB_SHA"),
            "GITHUB_BRANCH":os.environ.get("GITHUB_REF_NAME"),"RUNNER_OS":platform.platform(),
            "python":platform.python_version()}, open("evidence/run_meta.json","w"), indent=2)
          PY
      # ---------------- TEMPORAL ----------------
      - name: Temporal up
        run: |
          docker compose -f ci/compose.temporal.ci.yml up -d --build
          for i in $(seq 1 60); do docker compose -f ci/compose.temporal.ci.yml exec -T temporal tctl cluster health && break || sleep 3; done
      - name: Temporal digests + versions
        run: |
          { echo '{'; \
            echo "\"temporal_image_digest\":\"$(docker inspect --format='{{index .RepoDigests 0}}' temporalio/auto-setup:1.25.0 2>/dev/null)\","; \
            echo "\"postgres_image_digest\":\"$(docker inspect --format='{{index .RepoDigests 0}}' postgres:16 2>/dev/null)\""; \
            echo '}'; } > evidence/temporal_versions.json || true
      - name: Temporal tests (OBSERVED) + resource capture
        run: |
          ( while true; do docker stats --no-stream --format '{{.Name}} {{.CPUPerc}} {{.MemUsage}}' >> evidence/temporal_stats.log; sleep 5; done ) &
          STATS=$!
          pip install temporalio
          # T1 durable human wait + T2 crash-during-activity + T5 parallel-20 are driven here:
          python controller.py temporal | tee evidence/temporal_console.log
          # scripted crash/restart: kill a worker mid long-activity, then restart it
          docker kill $(docker ps -q --filter name=worker1) || true
          sleep 8
          docker compose -f ci/compose.temporal.ci.yml up -d worker1
          sleep 20
          kill $STATS || true
      - name: Temporal down
        if: always()
        run: docker compose -f ci/compose.temporal.ci.yml down -v
      # ---------------- HATCHET ----------------
      - name: Hatchet up + token
        run: |
          docker compose -f ci/compose.hatchet.ci.yml up -d --build postgres hatchet
          for i in $(seq 1 60); do curl -sf http://localhost:8888/ >/dev/null && break || sleep 3; done
          TOKEN=$(docker compose -f ci/compose.hatchet.ci.yml exec -T hatchet /hatchet-admin token create --config /config --tenant-id 707d0855-80ab-4e1f-a156-f1c4546cbf52 2>/dev/null | tail -1)
          echo "HATCHET_CLIENT_TOKEN=$TOKEN" >> $GITHUB_ENV
      - name: Hatchet workers up
        run: HATCHET_CLIENT_TOKEN=$HATCHET_CLIENT_TOKEN docker compose -f ci/compose.hatchet.ci.yml up -d --build worker1 worker2
      - name: Hatchet digests
        run: |
          { echo '{'; echo "\"hatchet_image_digest\":\"$(docker inspect --format='{{index .RepoDigests 0}}' $(docker compose -f ci/compose.hatchet.ci.yml images -q hatchet) 2>/dev/null)\""; echo '}'; } > evidence/hatchet_versions.json || true
      - name: Hatchet tests (OBSERVED) + resource capture
        run: |
          ( while true; do docker stats --no-stream --format '{{.Name}} {{.CPUPerc}} {{.MemUsage}}' >> evidence/hatchet_stats.log; sleep 5; done ) &
          STATS=$!
          pip install hatchet-sdk
          HATCHET_CLIENT_TOKEN=$HATCHET_CLIENT_TOKEN python controller.py hatchet | tee evidence/hatchet_console.log
          docker kill $(docker ps -q --filter name=worker1) || true
          sleep 8
          HATCHET_CLIENT_TOKEN=$HATCHET_CLIENT_TOKEN docker compose -f ci/compose.hatchet.ci.yml up -d worker1
          sleep 20
          kill $STATS || true
      - name: Hatchet down
        if: always()
        run: docker compose -f ci/compose.hatchet.ci.yml down -v
      # ---------------- ASSEMBLE + HASH EVIDENCE ----------------
      - name: Assemble evidence (OBSERVED/SIMULATED/NOT_TESTABLE) + hashes
        if: always()
        run: |
          python controller.py assemble   # reads consoles/stats/meta -> the 6 evidence JSON/MD files
          sha256sum evidence/P0E_*.json evidence/P0E_*.md > evidence/EVIDENCE_SHA256SUMS.txt || true
          cat evidence/EVIDENCE_SHA256SUMS.txt || true
      - name: Verify teardown
        if: always()
        run: |
          echo "containers:"; docker ps -a
          echo "volumes:"; docker volume ls
          test -z "$(docker ps -q)" && echo "POC_INFRA_REMAINING=FALSE" || echo "POC_INFRA_REMAINING=TRUE"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: p0e-live-bakeoff-evidence, path: 07_Reports/AI_Governance/Architecture/P0E_LIVE_BAKEOFF/evidence/ }
