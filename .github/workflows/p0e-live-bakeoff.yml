# P0-E Live Control-Plane Bake-Off — GitHub Actions V02.3 (ephemeral ubuntu-latest, Docker preinstalled).
# Copy to .github/workflows/p0e-live-bakeoff.yml on branch p0e/live-control-plane-bakeoff.
# V02.6 = HARNESS SEMANTICS CLOSURE (no redesign): L auto-completes after the long activity; Hatchet
#   server-liveness is transport-based (403 != down). No test-semantics/scoring/gate/production change.
# (carried) V02.5 = BOOTSTRAP CONFIGURATION CLOSURE:
#   * Temporal: BIND_ON_IP=0.0.0.0 (compose) + AUTHORITATIVE fail-closed frontend-health gate + server-bootstrap evidence.
#   * Hatchet: server cookie-domain/URL fix (compose) so the API starts; host maps hatchet->127.0.0.1 so host+workers use the same broadcast addr; server-ready evidence before token creation.
# (carried) V02.4 = RECOVERY/TOKEN CLOSURE:
#   * Temporal resume() awaits are BOUNDED (bounded deadlines) + run steps have timeout-minutes -> no infinite hang after restart.
#   * Hatchet run-scoped token is parsed by JWT-regex from the FULL admin output (fixes empty-token from `tail -1`),
#     with redacted stderr captured on failure. Same masked token to host + workers. No hardcoded/fallback credential.
# (still) BOOTSTRAP/READINESS CLOSURE from V02.3:
#   * Temporal: a STRICT, fail-closed poller readycheck (controller.py temporal readycheck) proves worker1/
#     worker2 register LIVE pollers BEFORE start; workers self-heal via connect-retry + restart:on-failure.
#   * Hatchet: run-scoped token is created robustly (JWT-shape asserted, masked, fail-closed if empty),
#     exported to BOTH the worker containers and the host controller process; a config readycheck proves the
#     client initialises before start; module import no longer needs a token (lazy client init).
#   * Both engines still run as SEPARATE, PARALLEL jobs; assemble_gate needs:[meta,temporal,hatchet],
#     if: always(), uploads evidence BEFORE a FAIL-CLOSED gate. No durability/acceptance criterion changed.
#   * On any engine failure, docker compose ps + (redacted) logs + server diagnostics are captured to evidence.
#   * Secrets are NEVER echoed/committed/uploaded (::add-mask:: + JWT redaction on captured logs).
name: p0e-live-bakeoff
on:
  workflow_dispatch: {}
  push: { branches: [ "p0e/live-control-plane-bakeoff" ] }
permissions: { contents: read }
env:
  HARNESS: 07_Reports/AI_Governance/Architecture/P0E_LIVE_BAKEOFF
jobs:
  # ------------------------------------------------------------------ metadata / provenance
  meta:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: 07_Reports/AI_Governance/Architecture/P0E_LIVE_BAKEOFF } }
    steps:
      - uses: actions/checkout@v4
      - name: Metadata + SDK versions
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import json,os,platform
          json.dump({"GITHUB_RUN_ID":os.environ.get("GITHUB_RUN_ID"),"GIT_COMMIT_SHA":os.environ.get("GITHUB_SHA"),
            "GITHUB_BRANCH":os.environ.get("GITHUB_REF_NAME"),"RUNNER_OS":platform.platform(),"python":platform.python_version()},
            open("evidence/run_meta.json","w"),indent=2)
          PY
          pip install temporalio hatchet-sdk pyyaml >/dev/null 2>&1 || pip install temporalio hatchet-sdk
          python3 - <<'PY'
          import json,importlib.metadata as m
          def v(p):
            try: return m.version(p)
            except Exception: return "unknown"
          json.dump({"temporalio":v("temporalio"),"hatchet_sdk":v("hatchet-sdk")}, open("evidence/sdk_versions.json","w"), indent=2)
          PY
      - name: Upload meta
        uses: actions/upload-artifact@v4
        with: { name: p0e-meta, path: 07_Reports/AI_Governance/Architecture/P0E_LIVE_BAKEOFF/evidence/ }

  # ------------------------------------------------------------------ TEMPORAL (independent job)
  temporal:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: 07_Reports/AI_Governance/Architecture/P0E_LIVE_BAKEOFF } }
    env:
      RESULTS_LOG: ${{ github.workspace }}/07_Reports/AI_Governance/Architecture/P0E_LIVE_BAKEOFF/evidence/results.jsonl
    steps:
      - uses: actions/checkout@v4
      - name: Setup host SDK
        run: mkdir -p evidence && (pip install temporalio pyyaml >/dev/null 2>&1 || pip install temporalio)
      - name: Temporal — up
        run: |
          export SE_DIR=$PWD/se_temporal; mkdir -p $SE_DIR; echo "SE_DIR=$SE_DIR" >> $GITHUB_ENV
          SE_DIR=$SE_DIR docker compose -f ci/compose.temporal.ci.yml up -d --build
          # AUTHORITATIVE frontend-health gate: with BIND_ON_IP=0.0.0.0 the frontend listens on 127.0.0.1 too.
          HEALTHY=0
          for i in $(seq 1 60); do
            if docker compose -f ci/compose.temporal.ci.yml exec -T temporal tctl cluster health >/tmp/th 2>&1; then HEALTHY=1; break; fi
            sleep 3
          done
          cp /tmp/th evidence/temporal_server_health.txt 2>/dev/null || true
          python3 -c "import json;json.dump({'TEMPORAL_FRONTEND_HEALTHY': ${HEALTHY}==1},open('evidence/temporal_server_bootstrap.json','w'),indent=2)"
          { echo '{'; echo "\"temporal_image_digest\":\"$(docker inspect --format='{{index .RepoDigests 0}}' temporalio/auto-setup:1.25.0 2>/dev/null)\","; echo "\"postgres_image_digest\":\"$(docker inspect --format='{{index .RepoDigests 0}}' postgres:16 2>/dev/null)\""; echo '}'; } > evidence/temporal_versions.json || true
          if [ "$HEALTHY" != 1 ]; then echo "TEMPORAL_FRONTEND_HEALTHY=FALSE (fail-closed)"; exit 1; fi
          echo "TEMPORAL_FRONTEND_HEALTHY=TRUE"
      - name: Temporal — readiness (STRICT, fail-closed poller gate)
        env: { TEMPORAL_ADDRESS: "localhost:7233" }
        run: |
          # writes evidence/temporal_bootstrap.json {TEMPORAL_WORKER_POLLERS_READY, TEMPORAL_WORKER_COUNT}; exits 1 if 0 pollers
          python controller.py temporal readycheck
      - name: Temporal — run (start, crash+DB restart, resume)
        timeout-minutes: 30
        env: { TEMPORAL_ADDRESS: "localhost:7233" }
        run: |
          ( while true; do docker stats --no-stream --format '{{.Name}} {{.CPUPerc}} {{.MemUsage}}' >> evidence/temporal_stats.log; sleep 5; done ) & echo $! > /tmp/stats.pid
          export SE_STORE=$SE_DIR/side_effects.json IDS_FILE=$SE_DIR/ids_temporal.json
          python controller.py temporal start
          docker kill $(docker ps -q --filter name=worker1) || true          # crash during long activity
          docker compose -f ci/compose.temporal.ci.yml restart postgresql temporal   # DB + orchestrator interruption
          sleep 10
          SE_DIR=$SE_DIR docker compose -f ci/compose.temporal.ci.yml up -d worker1   # restart worker
          sleep 15
          python controller.py temporal resume
          kill $(cat /tmp/stats.pid) || true
      - name: Temporal — diagnostics on failure
        if: failure()
        run: |
          { echo "== docker compose ps =="; docker compose -f ci/compose.temporal.ci.yml ps;
            echo "== worker logs =="; docker compose -f ci/compose.temporal.ci.yml logs --no-color --tail 200 worker1 worker2;
            echo "== temporal server logs =="; docker compose -f ci/compose.temporal.ci.yml logs --no-color --tail 120 temporal;
            echo "== cluster health =="; docker compose -f ci/compose.temporal.ci.yml exec -T temporal tctl cluster health; } > evidence/temporal_diagnostics.log 2>&1 || true
      - name: Temporal — down
        if: always()
        run: SE_DIR=$PWD/se_temporal docker compose -f ci/compose.temporal.ci.yml down -v
      - name: Temporal — verify teardown
        if: always()
        run: |
          echo "containers:"; docker ps -a
          test -z "$(docker ps -q)" && echo "POC_INFRA_REMAINING=FALSE" || (echo "POC_INFRA_REMAINING=TRUE"; exit 1)
      - name: Upload temporal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: p0e-temporal-evidence, path: 07_Reports/AI_Governance/Architecture/P0E_LIVE_BAKEOFF/evidence/ }

  # ------------------------------------------------------------------ HATCHET (independent job; NO needs: temporal)
  hatchet:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: 07_Reports/AI_Governance/Architecture/P0E_LIVE_BAKEOFF } }
    env:
      RESULTS_LOG: ${{ github.workspace }}/07_Reports/AI_Governance/Architecture/P0E_LIVE_BAKEOFF/evidence/results.jsonl
    steps:
      - uses: actions/checkout@v4
      - name: Setup host SDK
        run: mkdir -p evidence && (pip install hatchet-sdk pyyaml >/dev/null 2>&1 || pip install hatchet-sdk)
      - name: Hatchet — up + run-scoped token (robust, masked, fail-closed)
        run: |
          export SE_DIR=$PWD/se_hatchet; mkdir -p $SE_DIR; echo "SE_DIR=$SE_DIR" >> $GITHUB_ENV
          # host must reach the engine at the token's broadcast address (hatchet:7077); 7077 is published, so map it to loopback
          grep -q "[[:space:]]hatchet$" /etc/hosts || echo "127.0.0.1 hatchet" | sudo tee -a /etc/hosts >/dev/null
          SE_DIR=$SE_DIR docker compose -f ci/compose.hatchet.ci.yml up -d --build postgres hatchet
          # AUTHORITATIVE server-LIVENESS gate (transport only; NOT an auth-success claim).
          # V02.6 fix: `curl -sf` treated the server's real HTTP 403 on GET / as "down". Liveness = the server
          # returns ANY real HTTP status (http_code != 000). Auth/token/worker readiness stay separate fail-closed gates.
          SERVER_READY=0; LAST_CODE=000
          for i in $(seq 1 60); do
            LAST_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:8888/ 2>/dev/null || echo 000)
            case "$LAST_CODE" in ""|000) sleep 3;; *) SERVER_READY=1; break;; esac
          done
          python3 -c "import json;json.dump({'HATCHET_SERVER_READY': ${SERVER_READY}==1,'observed_http_code':'${LAST_CODE}','note':'liveness=transport-only; not an auth-success claim'},open('evidence/hatchet_server_bootstrap.json','w'),indent=2)"
          if [ "$SERVER_READY" != 1 ]; then
            { echo "== hatchet server logs (JWT-redacted) =="; docker compose -f ci/compose.hatchet.ci.yml logs --no-color --tail 200 hatchet; } 2>&1               | sed -E 's/[A-Za-z0-9_=-]{20,}\.[A-Za-z0-9_=-]{10,}\.[A-Za-z0-9_=-]{10,}/<REDACTED_JWT>/g' > evidence/hatchet_server_logs.log || true
            echo "HATCHET_SERVER_READY=FALSE (fail-closed)"; exit 1
          fi
          echo "HATCHET_SERVER_READY=TRUE"
          # create run-scoped token; EXTRACT the JWT (a.b.c) by regex from the FULL admin output.
          # V02.4 fix: `tail -1` grabbed an empty/log line -> empty token; regex-extract is order-independent.
          # tenant-id is a NON-secret identifier (hatchet-lite seeded default), overridable; the TOKEN is never hardcoded.
          HATCHET_TENANT_ID="${HATCHET_TENANT_ID:-707d0855-80ab-4e1f-a156-f1c4546cbf52}"
          TOKEN=""
          : > evidence/hatchet_token_stderr.log
          for i in $(seq 1 30); do
            RAW=$(docker compose -f ci/compose.hatchet.ci.yml exec -T hatchet /hatchet-admin token create --config /config --tenant-id "$HATCHET_TENANT_ID" 2>>evidence/hatchet_token_stderr.log | tr -d '\r')
            TOKEN=$(printf '%s\n' "$RAW" | grep -oE '[A-Za-z0-9_=-]+\.[A-Za-z0-9_=-]+\.[A-Za-z0-9_=-]+' | tail -1)
            [ -n "$TOKEN" ] && break || { TOKEN=""; sleep 3; }
          done
          # redact any JWT-shaped value that may have reached the captured stderr, before it becomes evidence
          sed -i -E 's/[A-Za-z0-9_=-]{20,}\.[A-Za-z0-9_=-]{10,}\.[A-Za-z0-9_=-]{10,}/<REDACTED_JWT>/g' evidence/hatchet_token_stderr.log || true
          if [ -z "$TOKEN" ]; then
            python3 -c "import json,os;os.makedirs('evidence',exist_ok=True);json.dump({'HATCHET_CLIENT_CONFIG_READY':False,'detail':{'reason':'TOKEN_CREATE_EMPTY','tenant_id_used':os.environ.get('HATCHET_TENANT_ID','default-seeded')}},open('evidence/hatchet_bootstrap.json','w'),indent=2)"
            echo "HATCHET token bootstrap FAILED (empty) — fail-closed (see evidence/hatchet_token_stderr.log, redacted)"; exit 1
          fi
          echo "::add-mask::$TOKEN"                       # never let the token appear in logs
          echo "HATCHET_CLIENT_TOKEN=$TOKEN" >> $GITHUB_ENV   # run-scoped: available to host + compose in later steps
          { echo '{'; echo "\"hatchet_image_digest\":\"$(docker inspect --format='{{index .RepoDigests 0}}' $(docker compose -f ci/compose.hatchet.ci.yml images -q hatchet) 2>/dev/null)\""; echo '}'; } > evidence/hatchet_versions.json || true
      - name: Hatchet — config readiness (STRICT, fail-closed)
        env: { HATCHET_CLIENT_TLS_STRATEGY: "none" }
        run: |
          # writes evidence/hatchet_bootstrap.json {HATCHET_CLIENT_CONFIG_READY}; exits 1 if token/config invalid
          python controller.py hatchet readycheck
      - name: Hatchet — start workers + prove workers live (fail-closed)
        env: { HATCHET_CLIENT_TLS_STRATEGY: "none" }
        run: |
          SE_DIR=$SE_DIR HATCHET_CLIENT_TOKEN=$HATCHET_CLIENT_TOKEN docker compose -f ci/compose.hatchet.ci.yml up -d --build worker1 worker2
          sleep 12
          UP=$(docker compose -f ci/compose.hatchet.ci.yml ps --services --filter "status=running" 2>/dev/null | grep -c -E '^worker[12]$' || true)
          export UP
          python3 - <<'PY'
          import json,os
          up=int(os.environ.get("UP","0") or 0)
          p="evidence/hatchet_bootstrap.json"; d={}
          if os.path.exists(p):
            try: d=json.load(open(p))
            except Exception: d={}
          d["HATCHET_WORKERS_READY"]= up>=2
          d["HATCHET_WORKER_COUNT"]= up
          json.dump(d, open(p,"w"), indent=2)
          print("HATCHET_WORKERS_READY=%s HATCHET_WORKER_COUNT=%d"%(up>=2, up))
          PY
          [ "${UP:-0}" -ge 2 ] || { echo "Hatchet workers not live (fail-closed)"; exit 1; }
      - name: Hatchet — run (start, crash+DB restart, resume)
        timeout-minutes: 30
        env: { HATCHET_CLIENT_TLS_STRATEGY: "none" }
        run: |
          ( while true; do docker stats --no-stream --format '{{.Name}} {{.CPUPerc}} {{.MemUsage}}' >> evidence/hatchet_stats.log; sleep 5; done ) & echo $! > /tmp/hstats.pid
          export SE_STORE=$SE_DIR/side_effects.json IDS_FILE=$SE_DIR/ids_hatchet.json
          python controller.py hatchet start
          docker kill $(docker ps -q --filter name=worker1) || true
          docker compose -f ci/compose.hatchet.ci.yml restart postgres hatchet
          sleep 12
          SE_DIR=$SE_DIR HATCHET_CLIENT_TOKEN=$HATCHET_CLIENT_TOKEN docker compose -f ci/compose.hatchet.ci.yml up -d worker1
          sleep 20
          python controller.py hatchet resume
          kill $(cat /tmp/hstats.pid) || true
      - name: Hatchet — diagnostics on failure (token-redacted)
        if: failure()
        run: |
          { echo "== docker compose ps =="; docker compose -f ci/compose.hatchet.ci.yml ps;
            echo "== logs (JWT-redacted) =="; docker compose -f ci/compose.hatchet.ci.yml logs --no-color --tail 200; } 2>&1 \
            | sed -E 's/[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}/<REDACTED_JWT>/g' > evidence/hatchet_diagnostics.log || true
      - name: Hatchet — down
        if: always()
        run: SE_DIR=$PWD/se_hatchet docker compose -f ci/compose.hatchet.ci.yml down -v
      - name: Hatchet — verify teardown
        if: always()
        run: |
          echo "containers:"; docker ps -a
          test -z "$(docker ps -q)" && echo "POC_INFRA_REMAINING=FALSE" || (echo "POC_INFRA_REMAINING=TRUE"; exit 1)
      - name: Upload hatchet evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: p0e-hatchet-evidence, path: 07_Reports/AI_Governance/Architecture/P0E_LIVE_BAKEOFF/evidence/ }

  # ------------------------------------------------------------------ ASSEMBLE + FAIL-CLOSED GATE
  assemble_gate:
    needs: [ meta, temporal, hatchet ]
    if: always()   # runs even if an engine job failed -> proves TEMPORAL_FAILURE_BLOCKS_HATCHET=FALSE and keeps the gate honest
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: 07_Reports/AI_Governance/Architecture/P0E_LIVE_BAKEOFF } }
    env:
      RESULTS_LOG: ${{ github.workspace }}/07_Reports/AI_Governance/Architecture/P0E_LIVE_BAKEOFF/evidence/results.jsonl
    steps:
      - uses: actions/checkout@v4
      - name: Download all engine evidence
        uses: actions/download-artifact@v4
        with: { path: 07_Reports/AI_Governance/Architecture/P0E_LIVE_BAKEOFF/dl }
      - name: Merge evidence (missing engine -> NOT_TESTABLE -> PENDING, fail-closed)
        run: |
          mkdir -p evidence
          cp dl/p0e-meta/run_meta.json                       evidence/ 2>/dev/null || true
          cp dl/p0e-meta/sdk_versions.json                   evidence/ 2>/dev/null || true
          cp dl/p0e-temporal-evidence/temporal_versions.json evidence/ 2>/dev/null || true
          cp dl/p0e-temporal-evidence/temporal_stats.log     evidence/ 2>/dev/null || true
          cp dl/p0e-temporal-evidence/temporal_bootstrap.json   evidence/ 2>/dev/null || true
          cp dl/p0e-temporal-evidence/temporal_diagnostics.log  evidence/ 2>/dev/null || true
          cp dl/p0e-temporal-evidence/temporal_recovery.json     evidence/ 2>/dev/null || true
          cp dl/p0e-temporal-evidence/temporal_server_bootstrap.json evidence/ 2>/dev/null || true
          cp dl/p0e-temporal-evidence/temporal_server_health.txt evidence/ 2>/dev/null || true
          cp dl/p0e-hatchet-evidence/hatchet_versions.json   evidence/ 2>/dev/null || true
          cp dl/p0e-hatchet-evidence/hatchet_stats.log       evidence/ 2>/dev/null || true
          cp dl/p0e-hatchet-evidence/hatchet_bootstrap.json     evidence/ 2>/dev/null || true
          cp dl/p0e-hatchet-evidence/hatchet_diagnostics.log    evidence/ 2>/dev/null || true
          cp dl/p0e-hatchet-evidence/hatchet_token_stderr.log   evidence/ 2>/dev/null || true
          cp dl/p0e-hatchet-evidence/hatchet_server_bootstrap.json evidence/ 2>/dev/null || true
          cp dl/p0e-hatchet-evidence/hatchet_server_logs.log    evidence/ 2>/dev/null || true
          : > evidence/results.jsonl
          cat dl/p0e-temporal-evidence/results.jsonl >> evidence/results.jsonl 2>/dev/null || true
          cat dl/p0e-hatchet-evidence/results.jsonl  >> evidence/results.jsonl 2>/dev/null || true
          echo "engines present:"; ls dl || true
          echo "bootstrap readiness:"; cat evidence/temporal_bootstrap.json 2>/dev/null; cat evidence/hatchet_bootstrap.json 2>/dev/null
          echo "merged results line count:"; wc -l evidence/results.jsonl || true
      - name: Assemble + hash
        run: |
          python controller.py assemble
          sha256sum evidence/P0E_*.json evidence/P0E_*.md evidence/results.jsonl evidence/*_bootstrap.json > evidence/EVIDENCE_SHA256SUMS.txt || true
          cat evidence/P0E_LIVE_FINAL_DECISION_V01.md || true
      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: p0e-live-bakeoff-evidence, path: 07_Reports/AI_Governance/Architecture/P0E_LIVE_BAKEOFF/evidence/ }
      - name: Fail-closed gate
        run: python controller.py gate
