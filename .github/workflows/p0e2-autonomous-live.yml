# .github/workflows/p0e2-autonomous-live.yml — P0-E2 Slice-2 LIVE autonomous runner (DISPOSABLE, NON-PROD).
# LIVE-RERUN-2 fixes: (D1) runner uses bounded namespace-readiness before post-restart dispatch;
#   (D2) evidence JSON booleans are emitted by evidence_json.py (real Python bools), no shell->python interpolation.
# HARDENED: SHA-pinned unambiguous checkout (no obsolete fallback; verify CHECKED_OUT_SHA==requested),
# structured failure-injection + poc evidence, and a STRICT independent fail-closed acceptance gate
# (acceptance_gate.py) as the authoritative final step. Reuses the P0-E1 disposable compose + ControlPlaneTask
# worker. No production, no publishing, no P1/Make/Render/social mutation.
name: p0e2-autonomous-live
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "IMMUTABLE full 40-hex commit SHA to check out (required; no branch names)"
        required: true
permissions: { contents: read }
env:
  P0E1: 07_Reports/AI_Governance/Architecture/P0E1_CONTROL_PLANE
  P0E2: 07_Reports/AI_Governance/Architecture/P0E2_AUTONOMOUS_RUNNER
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Validate requested SHA (fail-closed; must be a 40-hex commit)
        run: |
          REF="${{ github.event.inputs.ref }}"
          echo "$REF" | grep -Eq '^[0-9a-f]{40}$' || { echo "ref must be a full 40-hex commit SHA, got: $REF"; exit 1; }
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.inputs.ref }}" }
      - name: Verify checkout is exactly the requested SHA (no silent divergence)
        run: |
          mkdir -p "$P0E2/evidence"
          CHECKED_OUT_SHA=$(git rev-parse HEAD)
          echo "CHECKED_OUT_SHA=$CHECKED_OUT_SHA"
          echo "{\"requested\":\"${{ github.event.inputs.ref }}\",\"CHECKED_OUT_SHA\":\"$CHECKED_OUT_SHA\"}" > "$P0E2/evidence/checkout.json"
          [ "$CHECKED_OUT_SHA" = "${{ github.event.inputs.ref }}" ] || { echo "checkout SHA mismatch"; exit 1; }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Host SDK (pinned) + crypto
        run: pip install "temporalio==1.33.0" cryptography >/dev/null 2>&1 || pip install temporalio cryptography
      - name: Up disposable Temporal (reuse P0-E1 compose + ControlPlaneTask worker)
        working-directory: 07_Reports/AI_Governance/Architecture/P0E1_CONTROL_PLANE
        run: |
          export SE_DIR=$PWD/se; mkdir -p $SE_DIR; echo "SE_DIR=$SE_DIR" >> $GITHUB_ENV
          SE_DIR=$SE_DIR docker compose -f ci/compose.temporal-dev.ci.yml up -d --build
          H=0; for i in $(seq 1 60); do if docker compose -f ci/compose.temporal-dev.ci.yml exec -T temporal tctl cluster health >/tmp/h 2>&1; then H=1; break; fi; sleep 3; done
          [ "$H" = 1 ] || { echo "temporal not healthy"; exit 1; }
      - name: Run live A/B/C/D chain + inject failures (structured evidence)
        timeout-minutes: 35
        env: { TEMPORAL_ADDRESS: "localhost:7233", SE_STORE: "" }
        run: |
          C="docker compose -f $P0E1/ci/compose.temporal-dev.ci.yml"
          cp "$P0E2/seed/backlog_slice2.json" "$P0E2/evidence/BACKLOG_live.json"
          export PYTHONPATH="$PWD/$P0E1:$PWD/$P0E2" RESULT_DEADLINE_S=240 SE_STORE="$SE_DIR/side_effects.json"
          LEDGER="$PWD/$P0E2/evidence/EVENT_LEDGER.jsonl"; : > "$LEDGER"
          ( python "$P0E2/temporal_runner.py" run --backlog "$P0E2/evidence/BACKLOG_live.json" --ledger "$LEDGER" --evidence "$P0E2/evidence" ) & RUNPID=$!
          sleep 25
          KILL_TS=$(date -u +%FT%TZ); KILLED=false
          if docker kill $(docker ps -q --filter name=worker1) >/dev/null 2>&1; then KILLED=true; fi
          PGT=false; TMP=false
          $C restart postgresql temporal && { PGT=true; TMP=true; }
          sleep 12
          SE_DIR=$SE_DIR $C up -d worker1 || true
          REC_TS=$(date -u +%FT%TZ); RECOV=false
          W1=$(docker ps -q --filter name=worker1 | head -1)
          [ -n "$W1" ] && [ "$(docker inspect -f '{{.State.Running}}' $W1 2>/dev/null)" = "true" ] && RECOV=true
          THEALTH=false; $C exec -T temporal tctl cluster health >/dev/null 2>&1 && THEALTH=true
          wait $RUNPID || true
          DUP_TS=$(date -u +%FT%TZ)
          python "$P0E2/temporal_runner.py" run --backlog "$P0E2/evidence/BACKLOG_live.json" --ledger "$LEDGER" --evidence "$P0E2/evidence" || true
          DTASK=$(python3 -c "import json,sys;ts=json.load(open('$P0E2/evidence/BACKLOG_live.json'))['tasks'];print([t['status'] for t in ts if t['task_id']=='TASK_D'][0])" 2>/dev/null || echo unknown)
          EXECREC=false; [ "$DTASK" = "COMPLETED" ] && EXECREC=true
          FI_WORKER_KILL_OBSERVED="$KILLED" FI_WORKER_RECOVERY_OBSERVED="$RECOV"           FI_POSTGRES_RESTART_OBSERVED="$PGT" FI_TEMPORAL_RESTART_OBSERVED="$TMP"           FI_TEMPORAL_RECOVERY_OBSERVED="$THEALTH" FI_EXECUTION_RECOVERED="$EXECREC"           FI_WORKER_KILL_TS="$KILL_TS" FI_WORKER_RECOVERY_TS="$REC_TS" FI_DUPLICATE_DISPATCH_TS="$DUP_TS"           PYTHONPATH="$PWD/$P0E1:$PWD/$P0E2" python "$P0E2/evidence_json.py" failure_injection --out "$P0E2/evidence/failure_injection.json"
          cat "$P0E2/evidence/failure_injection.json"
      - name: Assemble raw results + Control Room V02 (non-fatal)
        if: always()
        env: { SE_STORE: "" }
        run: |
          export PYTHONPATH="$PWD/$P0E1:$PWD/$P0E2" SE_STORE="$SE_DIR/side_effects.json"
          python "$P0E2/temporal_runner.py" gate --backlog "$P0E2/evidence/BACKLOG_live.json" --ledger "$PWD/$P0E2/evidence/EVENT_LEDGER.jsonl" --evidence "$P0E2/evidence" || true
          python "$P0E2/control_room_v02.py" --ledger "$PWD/$P0E2/evidence/EVENT_LEDGER.jsonl" --backlog "$P0E2/evidence/BACKLOG_live.json" --live-results "$P0E2/evidence/P0E2_LIVE_RESULTS.json" --out-json "$P0E2/evidence/CONTROL_ROOM_V02.json" || true
      - name: Diagnostics on failure
        if: failure()
        working-directory: 07_Reports/AI_Governance/Architecture/P0E1_CONTROL_PLANE
        run: |
          set +e; C="docker compose -f ci/compose.temporal-dev.ci.yml"
          { echo "== ps =="; $C ps -a; echo "== worker1 =="; $C logs --no-color --tail all worker1; echo "== temporal =="; $C logs --no-color --tail 150 temporal; } > "../P0E2_AUTONOMOUS_RUNNER/evidence/p0e2_live_diagnostics.log" 2>&1
      - name: Teardown (unconditional)
        if: always()
        working-directory: 07_Reports/AI_Governance/Architecture/P0E1_CONTROL_PLANE
        run: SE_DIR=$PWD/se docker compose -f ci/compose.temporal-dev.ci.yml down -v || true
      - name: Verify teardown -> poc_infra.json (POC_INFRA_REMAINING)
        if: always()
        run: |
          docker ps -a
          if [ -z "$(docker ps -q)" ]; then POC=false; else POC=true; fi
          POC_INFRA_REMAINING="$POC" PYTHONPATH="$PWD/$P0E1:$PWD/$P0E2" python "$P0E2/evidence_json.py" poc --out "$P0E2/evidence/poc_infra.json"
          cat "$P0E2/evidence/poc_infra.json"
      - name: STRICT acceptance verdict (authoritative; writes P0E2_ACCEPTANCE_VERDICT.json; non-fatal here)
        if: always()
        run: |
          export PYTHONPATH="$PWD/$P0E1:$PWD/$P0E2"
          python "$P0E2/acceptance_gate.py" --evidence "$P0E2/evidence" || echo "verdict=FAIL"
      - name: Upload evidence (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: p0e2-autonomous-live-evidence, path: 07_Reports/AI_Governance/Architecture/P0E2_AUTONOMOUS_RUNNER/evidence/ }
      - name: FAIL-CLOSED final gate (exit non-zero unless FINAL=PASS)
        run: |
          python3 -c "import json,sys;v=json.load(open('$P0E2/evidence/P0E2_ACCEPTANCE_VERDICT.json'));print('FINAL=',v['FINAL']);sys.exit(0 if v['FINAL']=='PASS' else 1)"
